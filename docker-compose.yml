services:
  mongodb:
    image: mongo:7
    container_name: spacefetch-mongo
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: spacefetch
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: spacefetch-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: spacefetch-api
    # Public resolvers — the router's DNS drops lookups intermittently
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    ports:
      # Bind to localhost only — don't expose the API to the local network
      - "127.0.0.1:8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_ADDR=redis:6379
    restart: unless-stopped
    develop:
      watch:
        - path: ./cmd
          action: rebuild
        - path: ./internal
          action: rebuild
        - path: ./frontend
          action: rebuild

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: spacefetch-worker
    # Public resolvers — the worker fetches api.nasa.gov on every cycle
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_ADDR=redis:6379
    restart: unless-stopped
    develop:
      watch:
        - path: ./cmd
          action: rebuild
        - path: ./internal
          action: rebuild

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
